<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>Cardiac EP Mechanism Lab v2.2</title><style>body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f6f7f9;color:#142033}.load{max-width:560px;margin:12vh auto;padding:24px;text-align:center}.spin{width:32px;height:32px;border:3px solid #dfe3ea;border-top-color:#245fd6;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="load"><div class="spin"></div><b>Loading Cardiac EP Mechanism Lab…</b><p>Interactive electrophysiology teaching model v2.2</p></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/tylerdmcanally/EKGwebtool/main/cardiac-ep-v22/';const parts=await Promise.all([0,1,2,3,4].map(i=>fetch(base+'payload-'+i+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+i);return r.text()})));const b=parts.join('').trim();const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Browser does not support DecompressionStream');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([a]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="load"><b>Unable to load the EP lab.</b><p>'+String(e.message||e)+'</p></div>'}})();</script></body></html>
